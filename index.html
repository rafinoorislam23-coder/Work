<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b33">
<title>RAFINOOR | Multi-Zone Management</title>
<style>
:root{--nav:#101b33;--blue:#2864dc;--bg:#f3f6fb;--ink:#18243a;--muted:#718096;--line:#e4eaf2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101b33,#254a7c);padding:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}
.login .panel{width:min(440px,100%);padding:28px}
.brand{font-weight:900;font-size:23px;color:#17345f}
.sub,.muted{color:var(--muted);font-size:12px}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-weight:650;font-size:12px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dce4ef;border-radius:8px;background:white}
.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;font-weight:650;font-size:12px}
.primary{background:var(--blue);border-color:var(--blue);color:white}
.danger{color:#c33}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--nav);color:white;padding:18px;flex-shrink:0}
.side .brand{color:white;margin-bottom:22px}
.nav{display:block;width:100%;text-align:left;border:0;background:none;color:#d1d9e8;padding:11px;border-radius:8px;margin:3px 0}
.nav:hover,.nav.active{background:#263b5d}
.main{flex:1;min-width:0}
.top{height:62px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.content{padding:22px;max-width:1400px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{font-size:26px;font-weight:800}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);background:#fafbfd}
.notice{background:#fff4df;padding:12px;border-radius:8px;color:#80560c;font-size:12px;line-height:1.6}
.ok{color:#16734e}
.error{color:#c33}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fieldrow{display:grid;grid-template-columns:1.2fr 1fr .7fr .7fr auto;gap:7px;align-items:end;border:1px solid var(--line);padding:9px;border-radius:8px;margin:8px 0}
.fieldrow input,.fieldrow select{min-width:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}
.pill{padding:4px 8px;background:#eaf1ff;border-radius:20px;font-size:11px}
.hide{display:none}.fcard{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}.fr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:6px 0}.fr2 input{padding:7px;border:1px solid var(--line);border-radius:7px;min-width:0}.calc{padding:10px;background:#eaf1ff;border-radius:8px;font-weight:700}.fieldrow{grid-template-columns:1.2fr 1fr auto auto auto}
@media(max-width:850px){
  .layout{display:block}
  .side{width:auto;display:flex;overflow:auto;gap:5px;padding:8px}
  .side .brand{display:none}
  .nav{white-space:nowrap;width:auto}
  .grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:13px}
  .top{padding:0 12px}
  .cols{grid-template-columns:1fr}
  .fieldrow{grid-template-columns:1fr 1fr}
  .fieldrow>*:first-child{grid-column:1/-1}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="panel">
    <div class="brand">RAFINOOR</div>
    <div class="sub">DYNAMIC MULTI-ZONE MANAGEMENT SYSTEM</div>
    <h2>Sign in</h2>

    <div class="field">
      <label>Login Type</label>
      <select id="loginType">
        <option value="master">Master Admin Login</option>
        <option value="admin">Admin Login</option>
        <option value="user">User Login</option>
      </select>
    </div>

    <div id="masterBox" class="field">
      <label>Master Cloud Password</label>
      <input id="masterPass" type="password" placeholder="Master password">
    </div>

    <div id="tokenBox" class="field hidden">
      <label id="tokenLabel">Access Token</label>
      <input id="tokenInput" placeholder="Your access token">
    </div>

    <button class="btn primary" style="width:100%" id="loginBtn">Login</button>
    <p id="loginMsg" class="muted"></p>

    <div class="notice">Master: cloud password. Admin / User: access token.</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="layout hidden">
  <aside class="side">
    <div class="brand">RAFINOOR</div>
    <button class="nav active" data-page="dashboard">▦ Dashboard</button>
    <button class="nav" data-page="zones" data-role="master">◎ Zones</button>
    <button class="nav" data-page="tokens" data-role="admin">⌘ Tokens</button>
    <button class="nav" data-page="forms" data-role="admin">▤ Form Builder</button>
    <button class="nav" data-page="submit" data-role="user">✎ My Forms</button>
    <button class="nav" data-page="mine" data-role="user">▤ My Records</button>
    <button class="nav" data-page="fuel">⛽ Fuel Sheet</button>
    <button class="nav" data-page="reports" data-role="admin">▥ Reports</button>
    <button class="nav" data-page="logs" data-role="admin">☰ Audit Logs</button>
    <button class="nav" data-page="settings" data-role="zone">⚙ Zone Settings</button>
  </aside>
  <main class="main">
    <header class="top">
      <b id="pageTitle">Dashboard</b>
      <div class="row">
        <span id="identity" class="pill"></span>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, set, push, update, remove, onValue, query, limitToLast, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCUWbTvmbHfQpVe7B6-JKFHa-yuLQFJGbI",authDomain:"ft-server-b928d.firebaseapp.com",databaseURL:"https://ft-server-b928d-default-rtdb.firebaseio.com",projectId:"ft-server-b928d",storageBucket:"ft-server-b928d.firebasestorage.app",messagingSenderId:"123067166931",appId:"1:123067166931:web:73e4066f126e744daf6426",measurementId:"G-09SGQ45QYL"};
const auth=getAuth(initializeApp(firebaseConfig)), db=getDatabase();
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,profile=null,page="dashboard",draft=null;
const cache={zones:{},tokens:{},forms:{},records:{},auditLogs:{}},unsubs={};
const zoneId=()=>profile?.zoneId||"", isMaster=()=>profile?.role==="master", isAdmin=()=>["master","zoneAdmin"].includes(profile?.role);
const scoped=o=>Object.entries(o||{}).filter(([,v])=>isMaster()||v.zoneId===zoneId()||v.zoneId==="all");
const zoneName=id=>id==="all"?"All Zones":(cache.zones[id]?.name||id||"—");
const zoneOpts=(sel,all)=>(all?`<option value="all">All Zones</option>`:"")+Object.entries(cache.zones).map(([i,z])=>`<option value="${i}" ${sel===i?"selected":""}>${esc(z.name)}</option>`).join("");
const msg=(s,e)=>{$("loginMsg").textContent=s;$("loginMsg").className=e?"error":"ok"};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const genToken=(n=12)=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=crypto.getRandomValues(new Uint32Array(n));return [...a].map(x=>c[x%c.length]).join("")};
const log=(action,detail="")=>push(ref(db,"auditLogs"),{at:Date.now(),by:profile?.name||"",role:profile?.role||"",zoneId:zoneId(),action,detail}).catch(()=>{});
const copyText=async t=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove()}};
const LOCAL_MASTER_PASSWORD="rafinoor2024";

function updateLoginFields(){const t=$("loginType").value;$("masterBox").classList.toggle("hidden",t!=="master");$("tokenBox").classList.toggle("hidden",t==="master");$("tokenLabel").textContent=t==="admin"?"Admin Access Token":"User Access Token"}
$("loginType").onchange=updateLoginFields;updateLoginFields();

async function checkMaster(p){
  if(p===LOCAL_MASTER_PASSWORD)return true;
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch("https://script.google.com/macros/s/AKfycbwulHNmaFIIKkJlyVri6Hf2UUJnyqJi0sXFklQGtyC-6s_5kVYrqDbwodK_4qF_RTpM/exec",{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"login",password:p}),signal:c.signal});
    return JSON.parse(await r.text()).status==="success"}catch(e){return false}finally{clearTimeout(t)}
}
function watchToken(id){
  if(unsubs.tok)unsubs.tok();
  unsubs.tok=onValue(ref(db,"tokens/"+id),async s=>{const t=s.val();
    if(!t||t.active===false||(t.expiresAt&&t.expiresAt<Date.now())){alert("Your access was revoked or expired.");signOut(auth);return}
    if(profile&&(t.role!==profile.role||t.zoneId!==profile.zoneId||t.name!==profile.name)){
      const p={role:t.role,zoneId:t.zoneId,name:t.name,tokenId:id,createdAt:Date.now()};
      try{await set(ref(db,"userProfiles/"+profile.uid),p);profile={uid:profile.uid,...p};page="dashboard";showApp()}catch(e){console.error(e)}}});
}
$("loginBtn").onclick=async()=>{
  let step="sign-in";
  try{
    msg("Connecting…");const type=$("loginType").value;
    const uid=(await signInAnonymously(auth)).user.uid;user=auth.currentUser;
    if(type==="master"){
      const pw=$("masterPass").value.trim();if(!pw)throw Error("Enter master password");
      if(!await checkMaster(pw))throw Error("Wrong master password");
      const p={role:"master",name:"Master Admin",createdAt:Date.now()};
      step="write userProfiles";await set(ref(db,"userProfiles/"+uid),p);profile={uid,...p};
    }else{
      const token=$("tokenInput").value.trim().toUpperCase();if(!token)throw Error("Enter token");
      step="read tokenIndex";const idx=(await get(ref(db,"tokenIndex/"+await sha(token)))).val();
      if(!idx)throw Error("Invalid token");
      if(idx.active===false)throw Error("Token is disabled");
      if(idx.expiresAt&&idx.expiresAt<Date.now())throw Error("Token expired");
      step="read tokens";const tok=(await get(ref(db,"tokens/"+idx.tokenId))).val();
      if(!tok||tok.active===false)throw Error("Token not found or revoked");
      if(type==="admin"&&tok.role!=="zoneAdmin")throw Error("This is not an Admin token");
      if(type==="user"&&tok.role==="zoneAdmin")throw Error("Use Admin Login for this token");
      const p={role:tok.role,zoneId:tok.zoneId,name:tok.name,tokenId:idx.tokenId,createdAt:Date.now()};
      step="write userProfiles";await set(ref(db,"userProfiles/"+uid),p);profile={uid,...p};
      step="read zones";const z=(await get(ref(db,"zones/"+tok.zoneId))).val();
      if(!z||z.active===false){profile=null;throw Error("This zone is disabled or deleted")}
      watchToken(idx.tokenId);
    }
    msg("Login successful");log("login");showApp();
  }catch(e){msg((e.message||"Login failed")+(/permission/i.test(e.message)?" (step: "+step+" — check Firebase Rules)":""),true);try{await signOut(auth)}catch(_){}}
};
$("logoutBtn").onclick=()=>signOut(auth);
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("identity").textContent=(profile.name||"User")+" • "+profile.role;loadData();render()}
onAuthStateChanged(auth,async u=>{
  if(!u){user=null;profile=null;Object.values(unsubs).forEach(f=>f());$("app").classList.add("hidden");$("login").classList.remove("hidden");return}
  if(profile&&profile.uid===u.uid)return;
  try{user=u;const s=await get(ref(db,"userProfiles/"+u.uid));if(!s.exists())return;profile={uid:u.uid,...s.val()};if(profile.tokenId)watchToken(profile.tokenId);showApp()}catch(e){console.error(e)}
});
function loadData(){
  Object.keys(unsubs).filter(k=>k!=="tok").forEach(k=>{unsubs[k]();delete unsubs[k]});
  Object.assign(cache,{zones:{},tokens:{},forms:{},records:{},auditLogs:{}});
  const z=zoneId(),part={a:{},z:{}},q=(p,...c)=>query(ref(db,p),...c),byZone=(p,v,...x)=>q(p,orderByChild("zoneId"),equalTo(v),...x);
  const listen=(k,r,fn)=>{unsubs[k]=onValue(r,s=>{fn(s.val()||{});if(profile&&!$("dialog"))render()},e=>console.error(k,e.message))};
  if(isMaster()){
    ["zones","tokens","forms","records"].forEach(p=>listen(p,ref(db,p),v=>cache[p]=v));
    listen("auditLogs",q("auditLogs",limitToLast(300)),v=>cache.auditLogs=v);
  }else{
    listen("zones",ref(db,"zones/"+z),v=>cache.zones=Object.keys(v).length?{[z]:v}:{});
    listen("fz",byZone("forms",z),v=>{part.z=v;cache.forms={...part.a,...part.z}});
    listen("fa",byZone("forms","all"),v=>{part.a=v;cache.forms={...part.a,...part.z}});
    if(!isAdmin())listen("records",q("records",orderByChild("tokenId"),equalTo(profile.tokenId||"-")),v=>cache.records=v);
    if(isAdmin()){
      listen("tokens",byZone("tokens",z),v=>cache.tokens=v);
      listen("records",byZone("records",z),v=>cache.records=v);
      listen("auditLogs",byZone("auditLogs",z,limitToLast(300)),v=>cache.auditLogs=v);
    }
  }
}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.page));
function go(p){page=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function allowedNav(){document.querySelectorAll(".nav").forEach(b=>{const r=b.dataset.role;b.classList.toggle("hide",(r==="master"&&!isMaster())||(r==="admin"&&!isAdmin())||(r==="user"&&profile.role!=="user")||(r==="zone"&&profile.role!=="zoneAdmin"))})}
const PAGES={dashboard:()=>dashboard(),zones:()=>isMaster()&&zonesPage(),tokens:()=>isAdmin()&&tokensPage(),forms:()=>isAdmin()&&formsPage(),submit:()=>profile.role==="user"&&submitPage(),reports:()=>isAdmin()&&reportsPage(),logs:()=>isAdmin()&&logsPage(),settings:()=>profile.role==="zoneAdmin"&&settingsPage(),mine:()=>profile.role==="user"&&minePage(),fuel:()=>fuelPage()};
const TITLES={mine:"My Records",fuel:"Fuel Sheet",logs:"Audit Logs",submit:"My Forms",forms:"Form Builder",settings:"Zone Settings"};
function render(){
  if(!profile)return;allowedNav();
  const h=PAGES[page]?.();if(!h){page="dashboard";return render()}
  $("pageTitle").textContent=TITLES[page]||page[0].toUpperCase()+page.slice(1);$("view").innerHTML=h;bindPage();
}
function dashboard(){
  const c=o=>scoped(o).length;
  return `<h2>Welcome, ${esc(profile.name)}</h2><p class="muted">${isMaster()?"Master Center — global overview":"Zone: "+esc(zoneName(zoneId()))}</p>
  <div class="grid">${[["Zones",isMaster()?Object.keys(cache.zones).length:1],["Forms",c(cache.forms)],["Tokens",c(cache.tokens)],["Records",c(cache.records)]].map(([k,v])=>`<div class="panel"><div class="muted">${k}</div><div class="stat">${v}</div></div>`).join("")}</div>
  <div class="panel"><h3>System status</h3><p class="ok">● Firebase connected — live sync</p><p class="muted">Client-side mode: enforce zone isolation with Realtime Database Rules too.</p></div>`;
}
function zonesPage(){
  return `<div class="row"><h2>Zone Management</h2><button class="btn primary" id="addZone">+ Add Zone</button></div>
  <div class="panel tablewrap"><table><tr><th>Zone</th><th>Fuel rate (L/H)</th><th>Status</th><th>Action</th></tr>
  ${Object.entries(cache.zones).map(([i,z])=>`<tr><td>${esc(z.name)}</td><td>${z.fuelRate??2}</td><td>${z.active===false?"Disabled":"Active"}</td><td><button class="btn" data-zedit="${i}">Edit</button></td></tr>`).join("")}</table></div>`;
}
function tokensPage(){
  return `<div class="row"><h2>Token Management</h2><button class="btn primary" id="addToken">+ Generate Token</button></div>
  <div class="panel tablewrap"><table><tr><th>Token</th><th>Name</th><th>Role</th><th>Zone</th><th>Type</th><th>Expiry</th><th>Status</th><th>Action</th></tr>
  ${scoped(cache.tokens).map(([i,t])=>{const exp=t.expiresAt&&t.expiresAt<Date.now();return `<tr><td><b>${esc(t.token||t.tokenMasked)}</b></td><td>${esc(t.name)}</td><td>${t.role==="zoneAdmin"?"Admin":"User"}</td><td>${esc(zoneName(t.zoneId))}</td><td>${t.expiresAt?"Expiry":"Permanent"}</td><td>${t.expiresAt?new Date(t.expiresAt).toLocaleDateString():"Never"}</td><td>${exp?"Expired":t.active===false?"Revoked":"Active"}</td>
  <td>${t.token?`<button class="btn" data-copy="${esc(t.token)}">Copy</button> `:""}<button class="btn" data-tedit="${i}">Edit</button> <button class="btn" data-tog="${i}">${t.active===false?"Enable":"Revoke"}</button> <button class="btn danger" data-tdel="${i}">Delete</button></td></tr>`}).join("")}</table></div>`;
}
function formsPage(){
  return `<div class="row"><h2>Dynamic Form Builder</h2><button class="btn primary" id="newForm">+ Create Form</button><button class="btn" id="pgTpl">+ PG RUN template</button><button class="btn" id="fuTpl">+ Fuel Withdraw template</button><button class="btn" id="usTpl">+ Fuel Usage template</button><button class="btn primary" id="xlImp">⬆ Import Excel → Template</button><input type="file" id="xlIn" accept=".xlsx,.xlsb,.xls,.csv" class="hidden"></div>
  <div class="panel tablewrap"><table><tr><th>Form</th><th>Zone</th><th>Fields</th><th>Ver.</th><th>Status</th><th>Action</th></tr>
  ${scoped(cache.forms).map(([i,f])=>{const own=isMaster()||f.zoneId===zoneId();return `<tr><td>${esc(f.icon||"")} ${esc(f.name)}</td><td>${esc(zoneName(f.zoneId))}</td><td>${(f.fields||[]).length}</td><td>${f.version||1}</td><td>${f.active?"Published":"Hidden"}</td>
  <td>${own?`<button class="btn" data-edit="${i}">Edit</button> <button class="btn" data-hist="${i}">History</button> <button class="btn danger" data-fdel="${i}">Delete</button> `:""}<button class="btn" data-dup="${i}">Duplicate</button></td></tr>`}).join("")}</table></div>`;
}
function submitPage(){
  const forms=Object.entries(cache.forms).filter(([,f])=>f.active&&(f.zoneId==="all"||f.zoneId===zoneId()));
  return `<h2>My Forms</h2><div class="cols">${forms.map(([i,f])=>`<div class="panel"><h3>${esc(f.icon||"📋")} ${esc(f.name)}</h3><p class="muted">${(f.fields||[]).filter(x=>x.show!==false).length} fields</p><button class="btn primary" data-submit="${i}">Open Form</button></div>`).join("")||'<div class="panel">No forms assigned.</div>'}</div>`;
}
function reportsPage(){
  return `<div class="row"><h2>Reports</h2><button class="btn" id="xls">Export Excel</button><button class="btn" id="csv">Export CSV</button></div>
  <div class="panel tablewrap"><table><tr><th>Date</th><th>Form</th><th>User</th><th>Zone</th><th>Runtime h</th><th>Fuel L</th><th>Rate used</th><th></th></tr>
  ${scoped(cache.records).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)).map(([rid,r])=>`<tr><td>${esc(r.date)}</td><td>${esc(r.formName)}</td><td>${esc(r.userName)}</td><td>${esc(zoneName(r.zoneId))}</td><td>${r.runtimeHours||0}</td><td>${r.fuelLiters||0}</td><td>${r.fuelRate||0}</td><td><button class="btn" data-view="${rid}">View</button></td></tr>`).join("")}</table></div>`;
}
function logsPage(){
  return `<h2>Audit Logs</h2><div class="panel tablewrap"><table><tr><th>Time</th><th>By</th><th>Role</th><th>Zone</th><th>Action</th><th>Detail</th></tr>
  ${scoped(cache.auditLogs).sort((a,b)=>b[1].at-a[1].at).map(([,l])=>`<tr><td>${new Date(l.at).toLocaleString()}</td><td>${esc(l.by)}</td><td>${esc(l.role)}</td><td>${esc(zoneName(l.zoneId))}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join("")}</table></div>`;
}
function settingsPage(){
  const z=cache.zones[zoneId()]||{};
  return `<h2>Zone Settings</h2><div class="panel" style="max-width:480px"><div class="field"><label>Zone Name</label><input id="zoneName" value="${esc(z.name||"")}"></div>
  <div class="field"><label>Fuel Rate (Liter / Hour)</label><input id="fuelRate" type="number" min="0" step=".01" value="${z.fuelRate??2}"></div>
  <p class="muted">Changing the rate does not alter past reports.</p><button class="btn primary" id="saveZone">Save Settings</button></div>`;
}
const on=(id,fn)=>{if($(id))$(id).onclick=fn};
const all=(sel,fn)=>document.querySelectorAll(sel).forEach(fn);
function bindPage(){
  on("addZone",()=>zoneDialog());
  all("[data-zedit]",b=>b.onclick=()=>zoneDialog(b.dataset.zedit));
  on("addToken",tokenDialog);
  all("[data-tog]",b=>b.onclick=async()=>{const t=cache.tokens[b.dataset.tog],on_=t.active===false;await update(ref(db,"tokens/"+b.dataset.tog),{active:on_});await update(ref(db,"tokenIndex/"+t.hash),{active:on_});log(on_?"token enabled":"token revoked",t.name)});
  all("[data-reset]",b=>b.onclick=async()=>{const id=b.dataset.reset,t=cache.tokens[id];if(!confirm("Reset token for "+t.name+"? The old token stops working."))return;

/* ===== Excel -> form template (rule-based auto reader) ===== */
function xlAnalyze(XLSX,ws){
  if(!ws||!ws["!ref"])return null;
  const R=XLSX.utils.decode_range(ws["!ref"]),cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
  const txt=c=>c&&c.v!==undefined&&c.v!==null?String(c.v).replace(/\s+/g," ").trim():"";
  let hr=-1,best=0;
  for(let r=R.s.r;r<=Math.min(R.e.r,R.s.r+14);r++){let n=0;for(let c=R.s.c;c<=R.e.c;c++){const x=cell(r,c);if(x&&x.t==="s"&&txt(x))n++}if(n>best){best=n;hr=r}}
  if(hr<0||best<2)return null;
  const seen=new Set(),cols=[];let repeated=0;
  for(let c=R.s.c;c<=R.e.c;c++){const l=txt(cell(hr,c));if(!l)continue;const k=l.toLowerCase();if(seen.has(k)){repeated++;continue}seen.add(k);cols.push({c,label:l,letter:XLSX.utils.encode_col(c)})}

  for(let r=hr+1;r<=Math.min(R.e.r,hr+40);r++){if(!cols.some(x=>txt(cell(r,x.c))!==""))break;rows.push(r)}

  const map={};cols.forEach(x=>map[x.letter]=x);
  const isTimeFmt=c=>c.z&&/h+:m/i.test(c.z)&&!/[dy]/i.test(c.z.replace(/\[.*?\]/g,""));
  cols.forEach(x=>{

    if(!vs.length)return;
    if(vs.every(c=>c.v instanceof Date)){x.type=vs.some(c=>c.v.getHours()||c.v.getMinutes())?"datetime":"date"}
    else if(vs.every(c=>c.t==="n")){x.type=(vs.every(isTimeFmt)||(/time/i.test(x.label)&&vs.every(c=>c.v>=0&&c.v<1)))?"time":"number"}

}
function xlTranslate(f,row,map){
  let s=String(f).trim().replace(/^=/,"");
  const keyOf=(letter)=>map[letter]?map[letter].key:null,typeOf=k=>(Object.values(map).find(x=>x.key===k)||{}).type;
  let bad=false;
  s=s.replace(/IF\(\s*[A-Z]+\d+\s*=\s*""\s*,\s*""\s*,\s*TEXT\(\s*DATE\(\s*\d+\s*,\s*MONTH\(\s*([A-Z]+\d+)\s*\)\s*,\s*1\s*\)\s*,\s*"mmm"\s*\)\s*\)/gi,"mon($1)");

    const parts=a.split(",").map(p=>p.trim()).flatMap(p=>{
      const g=p.match(/^\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)$/);
      if(!g)return [p];
      if(Number(g[2])!==row||Number(g[4])!==row){bad=true;return []}
      const a1=XLSXcol(g[1]),a2=XLSXcol(g[3]);
      return Object.values(map).filter(x=>x.c>=a1&&x.c<=a2).map(x=>x.letter+row);
    });
    return "("+(parts.join("+")||"0")+")";
  });
  s=s.replace(/\b(ROUND|MIN|MAX)\(/gi,m=>m.toLowerCase());
  const ref=(l,n,dt)=>{if(Number(n)!==row||!map[l]){bad=true;return "0"}const k=map[l].key;return dt&&/^date/.test(map[l].type)?`serial(${k})`:k};
  if(s.includes("&")){
    const parts=[];let d=0,cur="";
    for(const ch of s){if(ch==="(")d++;if(ch===")")d--;if(ch==="&"&&d===0){parts.push(cur);cur=""}else cur+=ch}
    parts.push(cur);
    s="concat("+parts.map(p=>p.trim().replace(/^\$?([A-Z]{1,3})\$?(\d+)$/,(m,l,n)=>ref(l,n,true))).join(",")+")";
  }

  if(bad)return null;
  const okIds=new Set([...Object.values(map).map(x=>x.key),...RESERVED]);
  if(!/^[\w\s+\-*/%(),.]*$/.test(s)||/\.[A-Za-z_]/.test(s)||!(s.match(/[A-Za-z_]\w*/g)||[]).every(n=>okIds.has(n)))return null;
  return s;
}
const XLSXcol=l=>l.split("").reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;

function importExcel(file){
  if(typeof XLSX==="undefined")return alert("Excel library did not load — check your internet connection.");
  file.arrayBuffer().then(buf=>{
    const wb=XLSX.read(buf,{type:"array",cellDates:true,cellFormula:true});
    const sh=wb.SheetNames.map(n=>({n,a:xlAnalyze(XLSX,wb.Sheets[n])})).filter(x=>x.a);
    if(!sh.length)return alert("No table with a header row was found in this file.");
    const base=file.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ");
    const paint=i=>{const {a}=sh[i];$("impBody").innerHTML=`${a.wide?'<div class="notice">Wide monthly sheet detected — only the first copy of each repeated column is imported. For daily fuel entry use the “+ Fuel Withdraw template” and the Fuel Sheet page.</div>':""}
      <p class="muted">${a.cols.length} columns detected • ${a.cols.filter(c=>c.formula).length} formulas converted • ${a.cols.filter(c=>c.excel&&!c.formula).length} formulas could not be converted</p>
      <div class="tablewrap"><table><tr><th>Field</th><th>Type</th><th>Formula</th></tr>${a.cols.map(c=>`<tr><td>${esc(c.label)}</td><td>${c.type}${c.options?" ("+esc(c.options)+")":""}</td><td>${c.formula?'<span class="ok">✓ '+esc(c.formula)+"</span>":c.excel?'<span class="error">⚠ '+esc(c.excel.slice(0,60))+" (enter manually)</span>":"—"}</td></tr>`).join("")}</table></div>`};
    showDialog("Import Excel → Form Template",`<div class="field"><label>Form name</label><input id="impName" value="${esc(base)}"></div>
      ${sh.length>1?`<div class="field"><label>Sheet</label><select id="impSheet">${sh.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join("")}</select></div>`:""}
      <div id="impBody"></div><p><button class="btn primary" id="impGo">Create template</button></p>`);
    let cur=0;paint(0);if($("impSheet"))$("impSheet").onchange=e=>{cur=+e.target.value;paint(cur)};
    $("impGo").onclick=async()=>{
      const name=$("impName").value.trim();if(!name)return alert("Form name required");
      const fields=sh[cur].a.cols.map(c=>({label:c.label,key:c.key,type:c.type,show:true,...(c.options?{options:c.options}:{}),...(c.formula?{formula:c.formula}:{}),...(c.excel&&!c.formula?{note:"Excel: "+c.excel}:{})}));
      try{await saveNewForm(baseForm(name,"📊",fields));log("form imported from Excel",name);closeDialog();alert("Template created. Open it with Edit to adjust fields.")}catch(e){alert(e.message)}
    };

}

/* ===== Fuel Sheet (monthly matrix like the Excel) ===== */
let fuelMonth=new Date().toISOString().slice(0,7);
function fuelData(m){
  const [Y,M]=m.split("-").map(Number),days=new Date(Y,M,0).getDate(),people={},use=[];
  const num=(d,...ks)=>{for(const k of ks)if(d[k]!==undefined&&d[k]!=="")return Number(d[k]);return null};
  scoped(cache.records).forEach(([,r])=>{
    const d=r.data||{},dt=String(r.date||"").slice(0,10);
    if(d.used_fuel!==undefined&&dt.slice(0,7)===m)use.push({name:d.operator_name||r.userName,date:dt,used:d.used_fuel,purpose:d.purpose||"",site:d.site||""});
    const recv=num(d,"fuel_received","fuel_recv"),man=num(d,"pg_run_h","pg_run"),auto=num(d,"runtime","claimed_pg_rh"),hand=num(d,"fuel_in_hand");
    if(recv===null&&man===null&&auto===null&&hand===null)return;
    const k=r.tokenId||r.userName,p=people[k]||(people[k]={name:r.userName,zone:r.zoneId,day:{},before:null}),key=dt+String(r.createdAt||0).padStart(15,"0");
    if(dt.slice(0,7)<m){if(hand!==null&&(!p.before||key>p.before.k))p.before={k:key,v:hand};return}
    if(dt.slice(0,7)!==m)return;
    const dd=Number(dt.slice(8,10)),o=p.day[dd]||(p.day[dd]={recv:0,man:0,auto:0,hand:null,hk:""});
    o.recv+=recv||0;o.man+=man||0;o.auto+=auto||0;if(hand!==null&&key>o.hk){o.hand=hand;o.hk=key}
  });

    Object.keys(p.day).map(Number).sort((a,b)=>a-b).forEach(d=>{const o=p.day[d];recv+=o.recv;pg+=o.auto||o.man;if(o.hand!==null)hand=o.hand});
    return {...p,open:p.before?p.before.v:null,recv:+recv.toFixed(2),pg:+pg.toFixed(2),hand,cph:pg>0&&hand!==null?+((recv-hand)/pg).toFixed(3):null};
  }).sort((a,b)=>a.name.localeCompare(b.name));
  const R=rows.reduce((a,r)=>a+r.recv,0),H=rows.reduce((a,r)=>a+(r.hand||0),0),P=rows.reduce((a,r)=>a+r.pg,0),burnt=+(R-H).toFixed(2);
  return {days,rows,burnt,avg:P>0?+(burnt/P).toFixed(3):0,pg:+P.toFixed(2),use,Y,M};
}

function exportXLSX(entries){

}
