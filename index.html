<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b33">
<title>RAFINOOR | Multi-Zone Management</title>
<style>
:root{--nav:#101b33;--blue:#2864dc;--bg:#f3f6fb;--ink:#18243a;--muted:#718096;--line:#e4eaf2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101b33,#254a7c);padding:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px}
.login .panel{width:min(440px,100%);padding:28px}
.brand{font-weight:900;font-size:23px;color:#17345f}
.sub,.muted{color:var(--muted);font-size:12px}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-weight:650;font-size:12px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #dce4ef;border-radius:8px;background:white}
.btn{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;font-weight:650;font-size:12px}
.primary{background:var(--blue);border-color:var(--blue);color:white}
.danger{color:#c33}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--nav);color:white;padding:18px;flex-shrink:0}
.side .brand{color:white;margin-bottom:22px}
.nav{display:block;width:100%;text-align:left;border:0;background:none;color:#d1d9e8;padding:11px;border-radius:8px;margin:3px 0}
.nav:hover,.nav.active{background:#263b5d}
.main{flex:1;min-width:0}
.top{height:62px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}
.content{padding:22px;max-width:1400px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{font-size:26px;font-weight:800}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);background:#fafbfd}
.notice{background:#fff4df;padding:12px;border-radius:8px;color:#80560c;font-size:12px;line-height:1.6}
.ok{color:#16734e}
.error{color:#c33}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fieldrow{display:grid;grid-template-columns:1.2fr 1fr .7fr .7fr auto;gap:7px;align-items:end;border:1px solid var(--line);padding:9px;border-radius:8px;margin:8px 0}
.fieldrow input,.fieldrow select{min-width:0;width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}
.pill{padding:4px 8px;background:#eaf1ff;border-radius:20px;font-size:11px}
.hide{display:none}.fcard{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}.fr2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:6px 0}.fr2 input{padding:7px;border:1px solid var(--line);border-radius:7px;min-width:0}.calc{padding:10px;background:#eaf1ff;border-radius:8px;font-weight:700}.fieldrow{grid-template-columns:1.2fr 1fr auto auto auto}
@media(max-width:850px){
  .layout{display:block}
  .side{width:auto;display:flex;overflow:auto;gap:5px;padding:8px}
  .side .brand{display:none}
  .nav{white-space:nowrap;width:auto}
  .grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:13px}
  .top{padding:0 12px}
  .cols{grid-template-columns:1fr}
  .fieldrow{grid-template-columns:1fr 1fr}
  .fieldrow>*:first-child{grid-column:1/-1}
}

/* ===== Animations ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateX(40px) scale(.96)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.login{background:linear-gradient(135deg,#101b33,#254a7c,#1b5fa8,#101b33);background-size:300% 300%;animation:bg 14s ease infinite}
.login .panel{animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
#view.pg>*{animation:fadeUp .42s cubic-bezier(.2,.8,.3,1) both}
#view.pg>*:nth-child(2){animation-delay:.05s}#view.pg>*:nth-child(3){animation-delay:.1s}#view.pg>*:nth-child(4){animation-delay:.15s}#view.pg>*:nth-child(5){animation-delay:.2s}#view.pg>*:nth-child(n+6){animation-delay:.25s}
.panel{transition:transform .2s,box-shadow .2s}
body.desktop .grid .panel:hover{transform:translateY(-3px);box-shadow:0 10px 26px #1b2a4a1f}
.btn{transition:transform .12s,box-shadow .2s,background .2s,opacity .2s}
.btn:hover{box-shadow:0 4px 12px #1b2a4a1f}
.btn:active{transform:scale(.95)}
.primary:hover{background:#1f54c0}
.btn:disabled{opacity:.4;pointer-events:none}
.nav{transition:background .2s,transform .2s}
.nav i{font-style:normal;display:inline-block;width:20px;text-align:center;margin-right:8px}
body.desktop .nav:hover{transform:translateX(3px)}
body.desktop .nav.active{box-shadow:inset 3px 0 0 #5b8cff}
.field input:focus,.field select:focus,.field textarea:focus,.fr2 input:focus{outline:2px solid #2864dc55;border-color:var(--blue)}
.dlg{animation:fadeIn .18s}
.dlg>.panel{animation:pop .24s cubic-bezier(.2,.9,.3,1.1)}
.dlg.out{animation:fadeOut .2s forwards}
.leaving{animation:leave .3s ease forwards;pointer-events:none}
.fx{position:fixed;inset:0;background:#07132668;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;animation:fadeIn .15s}
.fx.out{animation:fadeOut .22s forwards}
.fxbox{background:#fff;border-radius:20px;padding:26px 36px;display:grid;justify-items:center;gap:12px;min-width:200px;animation:pop .26s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 24px 60px #0005;text-align:center}
.fxt{font-weight:700;color:#17345f}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid #dbe6fb;border-top-color:var(--blue);animation:spin .75s linear infinite}
.tick{width:62px;height:62px}
.tc{fill:none;stroke:#16a36a;stroke-width:3;stroke-dasharray:146;stroke-dashoffset:146;animation:draw .5s ease forwards}
.tp{fill:none;stroke:#16a36a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:42;stroke-dashoffset:42;animation:draw .35s .35s ease forwards}
.warnic{width:46px;height:46px;border-radius:50%;background:#fff4df;color:#c77d00;display:grid;place-items:center;font-weight:900;font-size:24px;animation:pulse 1s infinite}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:70;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:#101b33;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px #0004;font-weight:600;animation:toastIn .3s;max-width:340px}
.toast.out{opacity:0;transform:translateY(10px);transition:.3s}
.toast .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#16a36a;flex-shrink:0}
.toast.err .ti{background:#d94141}.toast.info .ti{background:#2864dc}
/* ===== Report tabs / lists ===== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-weight:700;white-space:nowrap;display:flex;gap:7px;align-items:center;transition:.2s}
.tab:hover{border-color:var(--blue)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 6px 16px #2864dc44}
.cnt{background:#0000000f;border-radius:99px;padding:1px 8px;font-size:11px}.tab.on .cnt{background:#ffffff33}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.filters input{padding:9px 11px;border:1px solid #dce4ef;border-radius:8px;background:#fff}
.filters .search{flex:1;min-width:160px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar .sp{flex:1}
.rt th{position:sticky;top:0;z-index:1}
.rt.panel,.tablewrap:has(.rt){max-height:68vh}
.empty{text-align:center;color:var(--muted);padding:30px}
.mcards{display:grid;gap:10px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.rtop{display:flex;align-items:center;gap:8px;margin-bottom:8px}.rtop b{flex:1}
.rkv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px;margin-bottom:10px}.rkv span{color:var(--muted)}.rkv b{text-align:right;word-break:break-word}
/* ===== Reports drill-down (Zone > Form > Data) ===== */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:8px 0}
.rbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;transition:.2s;cursor:pointer;font:inherit;color:inherit}
.rbox:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 20px #2864dc22}
.rbox b{font-size:15px}.rbox .ric{font-size:26px;line-height:1}
.crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}.crumb>span{color:var(--muted)}
body.mobile .rgrid{grid-template-columns:1fr 1fr;gap:10px}
/* ===== Phone UI ===== */
body.mobile{background:#eef2f9;-webkit-tap-highlight-color:transparent}
body.mobile .layout{display:block;padding-bottom:84px}
body.mobile .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:15;display:flex;overflow-x:auto;gap:2px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;box-shadow:0 -8px 28px #0005;scrollbar-width:none}
body.mobile .side .brand{display:none}
body.mobile .nav{flex:0 0 auto;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:8px 8px;text-align:center;border-radius:14px}
body.mobile .nav.hide{display:none}
body.mobile .nav i{font-size:19px;margin:0;width:auto}
body.mobile .nav.active{background:var(--blue);transform:translateY(-3px);box-shadow:0 6px 14px #2864dc66}
body.mobile .top{height:54px;padding:0 14px;background:var(--nav);color:#fff;border:0}
body.mobile .top .pill{background:#ffffff22;color:#fff;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mobile .top .btn{padding:7px 10px}
body.mobile .content{padding:12px}
body.mobile h2{font-size:18px;margin:6px 0}
body.mobile .grid{grid-template-columns:1fr 1fr;gap:10px}
body.mobile .stat{font-size:22px}
body.mobile .btn{padding:11px 14px;min-height:42px}
body.mobile .field input,body.mobile .field select,body.mobile .field textarea,body.mobile .filters input,body.mobile .fr2 input,body.mobile .fieldrow input,body.mobile .fieldrow select{font-size:16px}
body.mobile .cols{grid-template-columns:1fr}
body.mobile .dlg{place-items:end center!important;padding:0!important}
body.mobile .dlg>.panel{width:100%!important;max-height:92vh;border-radius:22px 22px 0 0;margin:0;animation:sheetUp .3s cubic-bezier(.2,.8,.3,1)}
body.mobile #toasts{left:12px;right:12px;bottom:92px}
body.mobile .toast{max-width:none}
body.mobile .cardt,body.mobile .cardt tbody{display:block;width:100%}
body.mobile .cardt tr{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin:0 0 10px}
body.mobile .cardt tr:first-child{display:none}
body.mobile .cardt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:7px 0;white-space:normal;text-align:right;flex-wrap:wrap}
body.mobile .cardt td::before{content:attr(data-label);color:var(--muted);font-weight:650;text-align:left}
body.mobile .panel:has(>.cardt){background:none;border:0;padding:0}
body.mobile .tablewrap:has(.cardt){overflow:visible}
body.mobile .bar .sp{display:none}
body.mobile .bar .btn{flex:1}
body.mobile .login .panel{padding:22px}

/* ===== Modern UI v2 ===== */
:root{--blue:#4f46e5;--nav:#0f172a;--bg:#f3f5fb;--line:#e7eaf3;--muted:#64748b;--ink:#0f172a}
body{font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:radial-gradient(900px 420px at 0 -80px,#e0e7ff,transparent 70%),var(--bg)}
h2{font-size:22px;letter-spacing:-.02em;margin:4px 0 12px}h3{margin:6px 0 10px}
.panel{border:1px solid #fff;border-radius:18px;box-shadow:0 1px 2px #0f172a0a,0 10px 28px #0f172a0d}
.btn{border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:650;box-shadow:0 1px 2px #0f172a0a}
.primary{background:linear-gradient(135deg,#4f46e5,#6d5cf6);border:0;color:#fff;box-shadow:0 6px 16px #4f46e540}
.primary:hover{background:linear-gradient(135deg,#4338ca,#5b4bf0)}
.danger{color:#dc2626}.btn.danger:hover{background:#fef2f2}
.field input,.field select,.field textarea,.filters input{border-radius:12px;border:1px solid #dfe4f0;background:#fbfcff;padding:11px 12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #4f46e522;border-color:#6366f1;background:#fff}
.side{background:linear-gradient(180deg,#0f172a,#1e1b4b)}
.side .brand{background:linear-gradient(90deg,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{border-radius:12px;color:#c7cdea}.nav:hover{background:#ffffff14}.nav.active{background:linear-gradient(135deg,#4f46e5,#6d5cf6);color:#fff}
body.desktop .nav.active{box-shadow:0 6px 16px #4f46e550}
.top{background:#ffffffd9;backdrop-filter:blur(14px)}
body.mobile .top{background:linear-gradient(135deg,#0f172a,#312e81)}
body.mobile .side{background:#0f172ae6;backdrop-filter:blur(16px)}
body.mobile .nav.active{background:linear-gradient(135deg,#4f46e5,#6d5cf6)}
.login{background:linear-gradient(135deg,#0f172a,#312e81,#4f46e5,#0f172a);background-size:300% 300%}
.brand{background:linear-gradient(90deg,#312e81,#4f46e5);-webkit-background-clip:text;background-clip:text;color:transparent}
table{border-radius:12px}th{background:#f6f7fc;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tr:hover td{background:#fafbff}
.tab.on{background:linear-gradient(135deg,#4f46e5,#6d5cf6);box-shadow:0 6px 16px #4f46e544}
.stat{background:linear-gradient(135deg,#312e81,#4f46e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.avbtn{width:38px;height:38px;border-radius:50%;border:2px solid #fff;padding:0;overflow:hidden;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:800;box-shadow:0 2px 8px #0003;display:grid;place-items:center}
.avbtn img,.av img{width:100%;height:100%;object-fit:cover}
.av{width:46px;height:46px;border-radius:50%;flex:0 0 auto;overflow:hidden;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center}
.av.big{width:96px;height:96px;font-size:38px;box-shadow:0 8px 24px #4f46e544}
.lbhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.lbhead select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#fff}
.lb{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:9px;transition:transform .2s,box-shadow .2s;animation:fadeUp .4s both}
.lb:hover{transform:translateY(-2px);box-shadow:0 10px 24px #4f46e51a}
.lb.dim{opacity:.5}.lb:nth-child(-n+3){background:linear-gradient(135deg,#fff,#f5f3ff)}
.rk{width:34px;text-align:center;font-size:22px;font-weight:800;color:#6366f1}
.lbi{flex:1;min-width:0}.lbi b{font-size:15px}
.note{font-size:12px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:6px;background:#eef0fb;border-radius:9px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#6366f1,#a855f7)}
.lbv{text-align:right;line-height:1.1}.lbv b{font-size:20px;display:block}.lbv span{font-size:11px;color:var(--muted)}
.lba{display:flex;gap:6px}.lba .btn{padding:6px 9px;min-height:0}
.dtw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field .dtw input[type=date],.field .dtw input[type=text]{width:auto;flex:1;min-width:120px}
.tpk{position:relative;width:44px;height:44px;border-radius:12px;background:#eef0fb;display:grid;place-items:center;cursor:pointer;font-size:18px;flex:0 0 auto}
.field .tpk input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer}
.dtw .btn{padding:0 12px;height:44px}
@media(max-width:600px){.lb{padding:10px;gap:9px}.av{width:40px;height:40px}.lbv b{font-size:17px}.lba{flex-direction:column}}

/* ===== Motion & colour pack ===== */
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-30px) scale(1.2)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.2)}75%{transform:rotate(14deg) scale(1.2)}}
@keyframes slideR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 0 0 0 #6366f180}100%{box-shadow:0 0 0 14px #6366f100}}
@keyframes lineflow{0%{background-position:0 0}100%{background-position:300% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none}
body::before{width:420px;height:420px;left:-120px;top:10%;background:#a5b4fc;animation:float1 16s ease-in-out infinite}
body::after{width:380px;height:380px;right:-100px;bottom:5%;background:#f9a8d4;animation:float2 19s ease-in-out infinite}
.login{position:relative;overflow:hidden}
.login::before,.login::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.6}
.login::before{width:340px;height:340px;background:#22d3ee;left:-80px;top:-60px;animation:float1 12s ease-in-out infinite}
.login::after{width:360px;height:360px;background:#f472b6;right:-90px;bottom:-70px;animation:float2 14s ease-in-out infinite}
.login .panel{position:relative;z-index:1;background:#ffffffee;backdrop-filter:blur(10px)}
.login .brand{display:inline-block;animation:bob 3s ease-in-out infinite}
.btn{position:relative;overflow:hidden}
.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,#ffffff66,transparent);animation:shine 3.2s infinite}
.btn:hover{transform:translateY(-2px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#6366f1,#ec4899,#f59e0b,#10b981,#06b6d4,#6366f1);background-size:300% 100%;animation:lineflow 6s linear infinite}
.nav:hover i,.nav.active i{animation:wiggle .6s}
.nav.active{animation:pop .35s}
.avbtn{animation:ring 2.2s infinite}.avbtn:hover{transform:scale(1.12) rotate(6deg)}
.av{transition:transform .25s}.lb:hover .av{transform:scale(1.12) rotate(-6deg)}
.lb:nth-child(1) .av{animation:ring 2s infinite}
.lb:nth-child(1){background:linear-gradient(135deg,#fffbeb,#fef3c7);border-color:#fcd34d}
.lb:nth-child(2){background:linear-gradient(135deg,#f8fafc,#e2e8f0)}
.lb:nth-child(3){background:linear-gradient(135deg,#fff7ed,#fed7aa)}
.rk{animation:bob 2.6s ease-in-out infinite}
.meter i{background-size:200% 100%;animation:lineflow 3s linear infinite;background-image:linear-gradient(90deg,#6366f1,#ec4899,#f59e0b,#6366f1)}
.grid .panel{color:#fff;border:0;position:relative;overflow:hidden}
.grid .panel .muted{color:#ffffffd0;font-weight:600}
.grid .panel .stat{background:none;-webkit-text-fill-color:#fff;color:#fff;text-shadow:0 2px 10px #0003}
.grid .panel::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:#ffffff26;animation:float1 9s ease-in-out infinite}

<!-- LOGIN -->
<div id="login" class="login">
  <div class="panel">
    <div class="brand">RAFINOOR</div>

  <main class="main">

      <b id="pageTitle">Dashboard</b>
      <div class="row">
        <button class="avbtn" id="meBtn" title="My profile"></button><span id="identity" class="pill"></span>
        <button class="btn" id="logoutBtn">Logout</button>

</div>

<script type="module">

const firebaseConfig={apiKey:"AIzaSyCUWbTvmbHfQpVe7B6-JKFHa-yuLQFJGbI",authDomain:"ft-server-b928d.firebaseapp.com",databaseURL:"https://ft-server-b928d-default-rtdb.firebaseio.com",projectId:"ft-server-b928d",storageBucket:"ft-server-b928d.firebasestorage.app",messagingSenderId:"123067166931",appId:"1:123067166931:web:73e4066f126e744daf6426",measurementId:"G-09SGQ45QYL"};
const auth=getAuth(initializeApp(firebaseConfig)), db=getDatabase();

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const msg=(s,e)=>{$("loginMsg").textContent=s;$("loginMsg").className=e?"error":"ok"};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");

const log=(action,detail="")=>push(ref(db,"auditLogs"),{at:Date.now(),by:profile?.name||"",role:profile?.role||"",zoneId:zoneId(),action,detail}).catch(()=>{});

/* ===== UI helpers: device mode, toast, saving animation ===== */
let lastPage="",pgT=0;
const mq=matchMedia("(max-width:850px), (pointer:coarse) and (max-width:1100px)"),isMob=()=>mq.matches;

applyMode();mq.addEventListener("change",()=>{applyMode();if(profile&&!$("dialog"))render()});
document.querySelectorAll(".nav").forEach(b=>{const m=b.textContent.trim().match(/^(\S+)\s+(.*)$/);if(m)b.innerHTML=`<i>${m[1]}</i><span>${m[2]}</span>`});
function toast(m,t="ok"){let c=$("toasts");if(!c){c=document.createElement("div");c.id="toasts";document.body.append(c)}
  const e=document.createElement("div");e.className="toast "+t;e.innerHTML=`<span class="ti">${t==="err"?"✕":t==="info"?"i":"✓"}</span><span>${esc(m)}</span>`;c.append(e);
  setTimeout(()=>{e.classList.add("out");setTimeout(()=>e.remove(),320)},2800)}
window.alert=m=>{m=String(m??"");document.querySelectorAll(".fx").forEach(x=>x.remove());
  if(m.includes("\n")){showDialog("Done",`<p style="white-space:pre-wrap;font-weight:650;font-size:15px;word-break:break-all">${esc(m)}</p>`);return}
  toast(m,/required|wrong|invalid|denied|permission|fail|could not|not found|first|pick|enter|no records|nothing|disabled|expired|revoked|not an|use admin|load/i.test(m)?"err":"ok")};

  const o=document.createElement("div");o.className="fx";o.innerHTML=`<div class="fxbox"><div class="spin"></div><div class="fxt">${esc(label)}</div></div>`;document.body.append(o);
  const t0=Date.now(),box=()=>o.querySelector(".fxbox");let done=false;
  const end=ms=>new Promise(r=>setTimeout(()=>{o.classList.add("out");setTimeout(()=>{o.remove();r()},230)},ms));
  const to=setTimeout(()=>{if(done)return;done=true;box().innerHTML='<div class="warnic">!</div><div class="fxt">Slow connection — will sync automatically</div>';end(2400)},12000);
  return {async ok(m="Saved"){if(done)return;done=true;clearTimeout(to);const w=450-(Date.now()-t0);if(w>0)await new Promise(r=>setTimeout(r,w));
    box().innerHTML=`<svg class="tick" viewBox="0 0 52 52"><circle class="tc" cx="26" cy="26" r="23"/><path class="tp" d="M14 27l8 8 16-17"/></svg><div class="fxt">${esc(m)}</div>`;await end(800)}}
}
const prevStat={};
function countUp(root){root.querySelectorAll(".stat[data-count]").forEach(el=>{
  const to=Number(el.dataset.count)||0,k=el.dataset.k,from=prevStat[k]??0;prevStat[k]=to;
  const dec=String(to).includes(".")?String(to).split(".")[1].length:0;
  if(from===to){el.textContent=to;return}
  el.textContent=from.toFixed(dec);const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=(from+(to-from)*e).toFixed(dec);if(p<1&&el.isConnected)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function cardify(root){if(!isMob())return;root.querySelectorAll("table:not(.keep)").forEach(t=>{
  const h=t.rows[0];if(!h||![...h.cells].every(c=>c.tagName==="TH"))return;const hs=[...h.cells].map(c=>c.textContent.trim());

const fuelCards=d=>`<div class="mcards" style="margin-bottom:12px">${d.rows.map(r=>`<div class="rcard"><div class="rtop"><b>${esc(r.name)}</b>${isAdmin()?`<button class="btn" data-fedit="${esc(r.key)}">✎</button>`:""}<span class="pill">CPH ${r.cph??"—"}</span></div><div class="rkv"><span>Opening</span><b>${r.open??"—"}</b><span>Received</span><b>${r.recv}</b><span>PG Run (H)</span><b>${r.pg}</b><span>In hand</span><b>${r.hand??"—"}</b></div></div>`).join("")}</div>`;


function updateLoginFields(){const t=$("loginType").value;$("masterBox").classList.toggle("hidden",t!=="master");$("tokenBox").classList.toggle("hidden",t==="master");$("tokenLabel").textContent=t==="admin"?"Admin Access Token":"User Access Token"}
$("loginType").onchange=updateLoginFields;updateLoginFields();

async function checkMaster(p){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch("https://script.google.com/macros/s/AKfycbwulHNmaFIIKkJlyVri6Hf2UUJnyqJi0sXFklQGtyC-6s_5kVYrqDbwodK_4qF_RTpM/exec",{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"login",password:p}),signal:c.signal});

function watchToken(id){
  if(unsubs.tok)unsubs.tok();
  unsubs.tok=onValue(ref(db,"tokens/"+id),async s=>{const t=s.val();
    if(!t||t.active===false||(t.expiresAt&&t.expiresAt<Date.now())){alert("Your access was revoked or expired.");signOut(auth);return}
    if(profile&&(t.role!==profile.role||t.zoneId!==profile.zoneId||t.name!==profile.name)){

$("loginBtn").onclick=async()=>{
  let step="sign-in";
  try{
    msg("Connecting…");const type=$("loginType").value;

    }else{
      const token=$("tokenInput").value.trim().toUpperCase();if(!token)throw Error("Enter token");
      step="read tokenIndex";const idx=(await get(ref(db,"tokenIndex/"+await sha(token)))).val();
      if(!idx)throw Error("Invalid token");
      if(idx.active===false)throw Error("Token is disabled");
      if(idx.expiresAt&&idx.expiresAt<Date.now())throw Error("Token expired");
      step="read tokens";const tok=(await get(ref(db,"tokens/"+idx.tokenId))).val();
      if(!tok||tok.active===false)throw Error("Token not found or revoked");
      if(type==="admin"&&tok.role!=="zoneAdmin")throw Error("This is not an Admin token");
      if(type==="user"&&tok.role==="zoneAdmin")throw Error("Use Admin Login for this token");

  const z=zoneId(),part={a:{},z:{}},q=(p,...c)=>query(ref(db,p),...c),byZone=(p,v,...x)=>q(p,orderByChild("zoneId"),equalTo(v),...x);
  const listen=(k,r,fn)=>{unsubs[k]=onValue(r,s=>{fn(s.val()||{});if(k==="records"){recLoaded=true;clearTimeout(stT);stT=setTimeout(syncStats,1500)}if(profile&&!$("dialog"))render()},e=>console.error(k,e.message))};

  const np={a:{},z:{}};
  if(isMaster())listen("notices",ref(db,"notices"),v=>cache.notices=v);

  showDialog("Edit — "+r.name+" • "+fuelMonth,`<p class="muted">${esc(zoneName(r.zone))} — choose a record to edit or delete.</p><div class="tablewrap"><table><tr><th>Date</th><th>Form</th><th>Data</th><th></th></tr>${recs.map(([id,x])=>{const sm=Object.entries(x.data||{}).filter(([k,v])=>/fuel|pg|hand|recv|run/i.test(k)&&v!==""&&typeof v!=="object").slice(0,4).map(([k,v])=>esc((x.labels?.[k]||k)+": "+v)).join(" • ");return `<tr><td>${esc(x.date)}</td><td>${esc(x.formName)}</td><td style="white-space:normal">${sm}</td><td><button class="btn" data-fe="${id}">Edit</button> <button class="btn danger" data-fd="${id}">Delete</button></td></tr>`}).join("")||'<tr><td colspan="4" class="empty">No records.</td></tr>'}</table></div>`);
  all("#dialog [data-fe]",b=>b.onclick=()=>{const x=cache.records[b.dataset.fe];if(!x||!cache.forms[x.formId])return alert("Form not found");submission(x.formId,b.dataset.fe)});
  all("#dialog [data-fd]",b=>b.onclick=async()=>{const id=b.dataset.fd,x=cache.records[id];if(!x||!confirm("Delete this record? It is removed everywhere."))return;try{await remove(ref(db,"records/"+id));log("record deleted",x.formName);toast("Deleted","ok");closeDialog()}catch(e){alert(e.message)}});
}
function exportFuelXLSX(){
  const d=fuelData(fuelMonth,fzone(),fq()),mn=new Date(d.Y,d.M-1,1).toLocaleString("en",{month:"short"}),v=x=>x===null||x===undefined?"":x,dc=Array.from({length:d.days},(_,i)=>i+1);
  const aoa=[["","","","","","","",...dc.flatMap(i=>[`${i} ${mn}`,"",""])],["Operator","Zone","Opening In Hand","Total Fuel Received","Total PG Run(H)","Total Fuel In Hand","CPH",...dc.flatMap(()=>["Fuel recv.","PG Run(H)","Fuel In Hand"])],
    ...d.rows.map(r=>[r.name,zoneName(r.zone),v(r.open),r.recv,r.pg,v(r.hand),v(r.cph),...dc.flatMap(i=>{const o=r.day[i];return o?[o.recv||"",o.auto||o.man||"",v(o.hand)]:["","",""]})]),
    [],["","","","","Fuel Burnt",d.burnt],["","","","","AVG CMPT",d.avg],["","","","","Total PG Run",d.pg],[],["Name","Date","Used Fuel","Purpose","Site"],...d.use.map(u=>[u.name,u.date,u.used,u.purpose,u.site])];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Fuel withdraw");
  {const ss=fuelSum(d);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Item","Total","Average","Lowest","Highest","Operators"],...ss.map(x=>[x.l,x.sum,x.avg,x.n?x.min:"",x.n?x.max:"",x.n])]),"Summary")}
  if(isMaster()&&!fz.zone){const zs=[["Zone","Fuel Burnt","AVG CMPT","Total PG Run(H)"],...Object.entries(cache.zones).map(([i,z])=>{const x=fuelData(fuelMonth,i,fq());return [z.name,x.burnt,x.avg,x.pg]})];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(zs),"Zone summary")}
  XLSX.writeFile(wb,`RAFINOOR-Fuel-${fz.zone&&isMaster()?zoneName(fz.zone).replace(/\s+/g,"-")+"-":""}${fuelMonth}.xlsx`);log("fuel sheet export",fuelMonth);
}
function exportXLSX(entries,label){
  if(typeof XLSX==="undefined")return alert("Excel library did not load — check your internet connection.");
  if(!entries.length)return alert("No records to export.");
  const by={};entries.forEach(([,r])=>{const k=r.formId||r.formName;(by[k]=by[k]||[]).push(r)});
  const wb=XLSX.utils.book_new(),names=new Set();
  Object.entries(by).forEach(([fid,list])=>{
    const f=cache.forms[fid],keys=[],lab={},typ={};
    (f?.fields||[]).forEach(x=>{if(x.show!==false){keys.push(x.key);lab[x.key]=x.label;typ[x.key]=x.type}});
    const hk=hidKeys(f);
    list.forEach(r=>Object.keys(r.data||{}).forEach(k=>{if(!hk.has(k)&&!keys.includes(k)){keys.push(k);lab[k]=r.labels?.[k]||k}}));
    const conv=(k,x)=>{if(x===undefined||x===null||x==="")return "";if(typ[k]==="datetime"||typ[k]==="date"){const d=dt(x);if(d)return d}return x};
    const aoa=[[...keys.map(k=>lab[k]),"Submitted By","Zone","Submitted At"],...list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(r=>[...keys.map(k=>conv(k,r.data?.[k])),r.userName,zoneName(r.zoneId),new Date(r.createdAt)])];
    const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true});
    Object.keys(ws).forEach(a=>{if(a[0]!=="!"&&ws[a].t==="d")ws[a].z="yyyy-mm-dd hh:mm"});
    ws["!cols"]=aoa[0].map(()=>({wch:18}));
    let n=String(list[0].formName||"Sheet").replace(/[\\/?*\[\]:]/g,"").slice(0,28)||"Sheet",i=2,b=n;while(names.has(n))n=b+" "+i++;names.add(n);
    XLSX.utils.book_append_sheet(wb,ws,n);
  });
  XLSX.writeFile(wb,"RAFINOOR-"+(label?label.replace(/\s+/g,"-")+"-"+new Date().toISOString().slice(0,10):Object.keys(by).length===1?[...names][0].replace(/\s+/g,"-"):"Reports")+".xlsx");log("excel export",label||"");toast("Excel download started","ok");
}
